name: Feature request
description: Propose an improvement to Dockside
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gamer, community, owner, or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the preferred panel behavior and workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Permissions, security, and data considerations
      description: Note any Docker, Discord, filesystem, network, backup, or authorization implications.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the project plan for this request.
          required: true
        - label: This request contains no credentials, personal information, or private server data.
          required: true
